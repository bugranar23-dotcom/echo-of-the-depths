name: Visual smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install display and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libx11-6 libxrandr2 libxrender1 libxxf86vm1 libxi6 libxext6
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt mss

      - name: Launch game and capture a real rendered frame
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" python tools/visual_smoke.py
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Save screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-of-the-depths-visual-smoke
          path: |
            visual-smoke.png
            visual-smoke.log
            echo_hata.txt
          if-no-files-found: warn
          retention-days: 7
